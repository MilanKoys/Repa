<div class="flex flex-col border-b border-slate-200 p-3">
    <div
        id="shell"
        class="grid grid-cols-[64px_minmax(0px,1fr)_auto] w-full gap-4 bg-white rouded-lg hover:bg-indigo-200 cursor-pointer"
    >
        <p class="font-semibold uppercase" id="type"></p>
        <p class="text-ellipsis overflow-hidden" id="about"></p>
        <div class="flex justify-self-end gap-2">
            <p class="text-slate-500"><span id="duration"></span> min</p>

            <button
                id="comment"
                class="hidden font-semibold h-fit py-1.5 px-2 text-white rounded-lg bg-white hover:bg-indigo-100 border-slate-200 hover:border-indigo-500 border cursor-pointer"
            >
                <div class="flex items-center justify-center">
                    <p id="comment_text" class="text-xs text-indigo-500">
                        Comment
                    </p>
                </div>
            </button>
        </div>
    </div>
    <input-text-component
        id="comment_input"
        class="hidden"
        placeholder="What needs fixing in this row?"
        size="small"
    ></input-text-component>
</div>

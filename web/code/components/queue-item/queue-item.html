<div
    id="shell"
    class="flex sm:flex-row flex-col gap-3 justify-between px-5 py-3.5 border-b border-slate-100 w-full"
>
    <div class="grid sm:grid-cols-9 items-center gap-3 w-full">
        <div class="flex gap-3 sm:col-span-2">
            <div
                class="size-4 bg-slate-200 rounded-full p-4 flex items-center justify-center"
            >
                <p id="avatar" class="font-bold text-slate-500 text-xs">UR</p>
            </div>
            <div class="flex items-center gap-1 overflow-hidden">
                <p
                    id="name"
                    class="text-sm text-slate-800 text-nowrap text-ellipsis overflow-hidden"
                >
                    User
                </p>
                <p
                    id="class"
                    class="text-slate-400 text-xs font-semibold flex-1"
                ></p>
            </div>
        </div>

        <div class="flex gap-5 items-center sm:col-span-2">
            <div class="flex flex-col">
                <p class="text-sm">Week <span id="week"></span></p>
                <p id="date" class="text-xs text-slate-400"></p>
            </div>
        </div>

        <div
            id="content"
            class="flex gap-2 min-w-0 overflow-hidden pe-2 mask-r-from-90% sm:col-span-5"
        ></div>
    </div>
    <button
        id="review"
        class="shrink-0 w-full sm:w-fit self-start sm:self-center text-sm font-semibold h-fit py-2 px-3 text-white rounded-lg bg-indigo-500 hover:bg-indigo-600 cursor-pointer"
    >
        <div class="flex items-center justify-center text-xs text-nowrap">
            <p>Review</p>
        </div>
    </button>
</div>

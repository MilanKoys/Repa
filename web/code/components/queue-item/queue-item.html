<div
    id="shell"
    class="flex sm:flex-row flex-col gap-3 justify-between px-5 py-3.5 border-b border-slate-100 w-full"
>
    <div class="grid sm:grid-cols-2 items-center gap-3 w-full">
        <div class="flex gap-3">
            <div
                class="size-4 bg-slate-200 rounded-full p-4 flex items-center justify-center"
            >
                <p id="avatar" class="font-bold text-slate-500 text-xs">UR</p>
            </div>
            <div class="flex items-center gap-1">
                <p id="name" class="text-sm text-slate-800">User</p>
                <p id="class" class="text-slate-400 text-xs font-semibold"></p>
            </div>
        </div>
        <div class="flex gap-5 items-center">
            <div class="flex flex-col">
                <p class="text-sm">Week <span id="week"></span></p>
                <p id="date" class="text-xs text-slate-400"></p>
            </div>
        </div>
    </div>
    <div class="flex justify-between items-center w-full">
        <div id="content" class="flex gap-2"></div>
        <button
            id="review"
            class="text-sm w-fit font-semibold h-fit py-2 px-3 text-white rounded-lg bg-indigo-500 hover:bg-indigo-600 cursor-pointer"
        >
            <div class="flex items-center justify-center text-xs">
                <p>Review</p>
            </div>
        </button>
    </div>
</div>

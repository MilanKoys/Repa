<div id="content" class="absolute top-0 left-0 hidden">
    <div class="w-dvw h-dvh bg-black/20 flex justify-center items-center">
        <div
            class="border border-slate-200 rounded-xl bg-white p-6 flex flex-col max-w-md w-full gap-4 m-6"
        >
            <div class="flex justify-between items-center">
                <div class="flex flex-col">
                    <p id="header" class="text-lg font-semibold">Add class</p>
                    <p class="text-xs text-slate-500">
                        Week <span id="week">-</span> ·
                        <span id="date">From – Till</span>
                    </p>
                </div>
                <div
                    id="close"
                    class="flex text-xl items-center justify-center size-7 bg-white text-slate-500 rounded hover:bg-slate-100 cursor-pointer select-none"
                >
                    ×
                </div>
            </div>
            <div class="flex flex-col gap-3">
                <div class="grid sm:grid-cols-2 grid-cols-1 gap-3">
                    <input-text-component
                        uppercase="true"
                        id="type"
                        placeholder="ZIW"
                        label="Class"
                    ></input-text-component>
                    <input-text-component
                        id="duration"
                        placeholder="45"
                        type="number"
                        label="Duration"
                    ></input-text-component>
                </div>
                <input-text-component
                    id="about"
                    placeholder="What was covered"
                    label="Description"
                ></input-text-component>
            </div>
            <p id="error" class="text-red-400 text-sm hidden">Error</p>
            <div class="flex justify-between gap-2">
                <div>
                    <button
                        id="delete"
                        class="text-sm hidden h-fit py-2 px-3 bg-red-100 border rounded-lg hover:bg-red-200 border-red-100 text-red-400 cursor-pointer"
                    >
                        <div class="flex items-center justify-center">
                            <p>Delete</p>
                        </div>
                    </button>
                </div>
                <div class="flex gap-2">
                    <button
                        id="cancel"
                        class="text-sm h-fit py-2 px-3 bg-white border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer"
                    >
                        <div class="flex items-center justify-center">
                            <p>Cancel</p>
                        </div>
                    </button>
                    <button
                        id="submit"
                        class="text-sm font-semibold h-fit py-2 px-3 text-white rounded-lg bg-indigo-500 hover:bg-indigo-600 cursor-pointer"
                    >
                        <div class="flex items-center justify-center">
                            <p>Submit</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

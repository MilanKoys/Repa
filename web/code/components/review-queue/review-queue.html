<div class="flex flex-col gap-6">
    <div class="flex gap-3 flex-wrap justify-between items-end">
        <div class="flex flex-col gap">
            <p id="date" class="text-slate-600 text-sm"></p>
            <p class="sm:text-3xl font-semibold text-2xl">Review queue</p>
            <p class="text-slate-600 text-sm mt-1">
                <span id="count"></span> weeks wating for your review
            </p>
        </div>

        <div id="class-selector" class="flex p-1 bg-slate-200 rounded-lg gap-1">
            <button
                id="my-class"
                class="text-xs font-semibold h-fit py-1.5 px-3 bg-white rounded-lg bg-white-500 cursor-pointer"
            >
                <div class="flex items-center justify-center">
                    <p>My class</p>
                </div>
            </button>
            <button
                id="all-class"
                class="text-xs font-semibold h-fit py-1.5 px-3 text-slate-400 hover:text-slate-500 rounded-lg bg-white-500 cursor-pointer"
            >
                <div class="flex items-center justify-center">
                    <p>All classes</p>
                </div>
            </button>
        </div>
    </div>

    <div
        id="content"
        class="border border-slate-200 bg-white rounded-xl overflow-hidden text-sm text-slate-500"
    ></div>
</div>
